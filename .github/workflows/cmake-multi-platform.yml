name: CMake Build

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libsqlite3-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        timeout-minutes: 5
        run: |
          brew install cmake ninja curl 2>/dev/null || brew upgrade cmake ninja curl 2>/dev/null || true

      - name: Setup vcpkg (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 15
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Cache vcpkg packages (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/packages
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-windows-

      - name: Set reusable strings
        id: strings
        shell: bash
        timeout-minutes: 1
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (Unix)
        if: matrix.os != 'windows-latest'
        timeout-minutes: 5
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DFALCON_BUILD_TESTS=ON
          -DFALCON_BUILD_CLI=OFF
          -DFALCON_BUILD_DESKTOP=OFF
          -DFALCON_ENABLE_HTTP=ON
          -DFALCON_ENABLE_FTP=OFF
          -DFALCON_ENABLE_CLOUD_STORAGE=OFF
          -DFALCON_ENABLE_RESOURCE_SEARCH=OFF
          -DFALCON_ENABLE_RESOURCE_BROWSER=OFF
          -DFALCON_BUILD_DAEMON=OFF
          -DFALCON_BUILD_EXAMPLES=OFF
          -S ${{ github.workspace }}

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 20
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DFALCON_BUILD_TESTS=ON
          -DFALCON_BUILD_CLI=OFF
          -DFALCON_BUILD_DESKTOP=OFF
          -DFALCON_ENABLE_HTTP=ON
          -DFALCON_ENABLE_FTP=OFF
          -DFALCON_ENABLE_CLOUD_STORAGE=OFF
          -DFALCON_ENABLE_RESOURCE_SEARCH=OFF
          -DFALCON_ENABLE_RESOURCE_BROWSER=OFF
          -DFALCON_BUILD_DAEMON=OFF
          -DFALCON_BUILD_EXAMPLES=OFF
          -S ${{ github.workspace }}

      - name: Build
        timeout-minutes: 15
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel

      - name: Test
        timeout-minutes: 15
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure --timeout 120

  coverage:
    name: Coverage (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Install dependencies (Ubuntu)
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          pipx install gcovr==8.6
          ./vcpkg/vcpkg install --triplet x64-linux

      - name: Configure CMake
        timeout-minutes: 5
        run: >
          cmake -B ${{ github.workspace }}/build-coverage
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DFALCON_BUILD_TESTS=ON
          -DFALCON_BUILD_CLI=ON
          -DFALCON_BUILD_DESKTOP=OFF
          -DFALCON_BUILD_DAEMON=ON
          -DFALCON_BUILD_EXAMPLES=OFF
          -DFALCON_ENABLE_COVERAGE=ON
          -S ${{ github.workspace }}

      - name: Build
        timeout-minutes: 15
        run: cmake --build ${{ github.workspace }}/build-coverage --config Debug --parallel

      - name: Test
        timeout-minutes: 30
        working-directory: ${{ github.workspace }}/build-coverage
        run: ctest --build-config Debug --output-on-failure --timeout 120

      # 口径与本地铁账一致（gcovr 8.6 + merge flag + 只扫 packages/）：
      # 缺 --merge-mode-functions 时 gcc 15 行归属差异会使合并直接抛异常，
      # 旧配置在 continue-on-error 掩护下产出残缺 coverage.xml（Codecov
      # 曾显示 89% 的虚假口径）。CLI/daemon 打开使口径覆盖全部包
      # （desktop 无 Qt 环境保持 OFF，与本地铁账一致）
      - name: Generate coverage (gcovr)
        timeout-minutes: 10
        working-directory: ${{ github.workspace }}/build-coverage
        run: |
          gcovr -r ${{ github.workspace }} \
            --filter '../packages/' \
            -e '.*/tests/.*' \
            --merge-mode-functions=merge-use-line-min \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --xml-pretty -o coverage.xml

      - name: Upload to Codecov
        timeout-minutes: 3
        uses: codecov/codecov-action@v5
        with:
          files: ${{ github.workspace }}/build-coverage/coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  desktop-build:
    name: Desktop Application (Qt6)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        include:
          - os: ubuntu-latest
            vcpkg-triplet: 'x64-linux'
            cmake-generator: 'Unix Makefiles'
          - os: macos-15
            vcpkg-triplet: 'arm64-osx'
            cmake-generator: 'Unix Makefiles'
          - os: windows-latest
            vcpkg-triplet: 'x64-windows'

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          # 桌面端 Qt 用发行版系统包（qt6-base-dev）：vcpkg qtbase[xcb]
          # 不产出 libqxcb.so 平台插件且耗时 20+ 分钟，系统包布局天然
          # 自洽。vcpkg 继续供给其余依赖（与 nightly 打包路线一致）
          sudo apt-get install -y \
            build-essential \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libcurl4-openssl-dev \
            libsqlite3-dev \
            libgl1-mesa-dev \
            qt6-base-dev \
            qt6-svg-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          brew install cmake ninja curl autoconf autoconf-archive automake libtool 2>/dev/null || brew upgrade cmake ninja curl autoconf autoconf-archive automake libtool 2>/dev/null || true

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 5
        run: |
          choco install cmake ninja curl -y

      - name: Setup vcpkg (Unix)
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/packages
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-desktop-${{ matrix.vcpkg-triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-desktop-${{ matrix.vcpkg-triplet }}-

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        timeout-minutes: 120
        run: >
          cmake -B ${{ github.workspace }}/build-desktop
          -G "${{ matrix.cmake-generator }}"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg-triplet }}
          -DVCPKG_MANIFEST_FEATURES=desktop
          -DFALCON_BUILD_TESTS=OFF
          -DFALCON_BUILD_CLI=OFF
          -DFALCON_BUILD_DESKTOP=ON
          # desktop 链接 falcon_daemon_rpc_client（daemon RPC 后端），需一并构建
          -DFALCON_BUILD_DAEMON=ON
          -DFALCON_BUILD_EXAMPLES=OFF
          -DFALCON_ENABLE_HTTP=ON
          -DFALCON_ENABLE_FTP=ON
          -S ${{ github.workspace }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 120
        run: >
          cmake -B ${{ github.workspace }}/build-desktop
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg-triplet }}
          -DVCPKG_MANIFEST_FEATURES=desktop
          -DFALCON_BUILD_TESTS=OFF
          -DFALCON_BUILD_CLI=OFF
          -DFALCON_BUILD_DESKTOP=ON
          # desktop 链接 falcon_daemon_rpc_client（daemon RPC 后端），需一并构建
          -DFALCON_BUILD_DAEMON=ON
          -DFALCON_BUILD_EXAMPLES=OFF
          -DFALCON_ENABLE_HTTP=ON
          -DFALCON_ENABLE_FTP=ON
          -S ${{ github.workspace }}

      - name: Build
        timeout-minutes: 30
        run: cmake --build ${{ github.workspace }}/build-desktop --config Release --parallel

      - name: Upload artifacts (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        timeout-minutes: 3
        with:
          name: falcon-desktop-${{ matrix.os }}
          path: ${{ github.workspace }}/build-desktop/bin/falcon-desktop*
          retention-days: 7

      # Windows 产物必须可直接运行：此前只上传裸 exe，用户机器上缺
      # Qt DLL 与平台插件必然起不来。目录布局与 nightly 一致（exe +
      # 全部依赖 DLL + plugins/ 子目录 + qt.conf 指引 + MSVC CRT）
      - name: Package (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          cd ${{ github.workspace }}/build-desktop/bin/Release

          New-Item -ItemType Directory -Force -Path falcon-desktop
          Copy-Item falcon-desktop.exe falcon-desktop/
          Copy-Item falcon-daemon.exe falcon-desktop/ -ErrorAction SilentlyContinue

          # vcpkg manifest 模式下依赖 DLL 在 <build>/vcpkg_installed/<triplet>/bin，
          # 经典模式才在 <workspace>/vcpkg/installed/<triplet>/bin
          $triplet = "${{ matrix.vcpkg-triplet }}"
          $manifestBin = "${{ github.workspace }}/build-desktop/vcpkg_installed/$triplet/bin"
          $classicBin = "${{ github.workspace }}/vcpkg/installed/$triplet/bin"
          if (Test-Path $manifestBin) {
            Copy-Item "$manifestBin/*.dll" falcon-desktop/ -Force
            Write-Host "Copied DLLs from manifest tree: $manifestBin"
          } elseif (Test-Path $classicBin) {
            Copy-Item "$classicBin/*.dll" falcon-desktop/ -Force
            Write-Host "Copied DLLs from classic tree: $classicBin"
          } else {
            Write-Error "vcpkg DLL directory not found (checked manifest and classic trees)"
            exit 1
          }

          # Qt 插件随包（缺 platforms/qwindows.dll 时 GUI 无法启动）
          $qtPluginDir = "${{ github.workspace }}/build-desktop/vcpkg_installed/$triplet/Qt6/plugins"
          if (Test-Path $qtPluginDir) {
            foreach ($category in @("platforms", "styles", "imageformats", "tls")) {
              $src = Join-Path $qtPluginDir $category
              if (Test-Path $src) {
                New-Item -ItemType Directory -Force -Path "falcon-desktop/plugins/$category" | Out-Null
                Copy-Item "$src/*.dll" "falcon-desktop/plugins/$category/" -Force
              }
            }
            Write-Host "Copied Qt plugins from $qtPluginDir"
          } else {
            Write-Warning "Qt plugin directory not found: $qtPluginDir"
          }

          # qt.conf 把插件根指到 plugins/ 子目录（Qt 只自动搜
          # <exe 目录>/platforms/，缺指引就报 "Could not find the Qt
          # platform plugin windows"——nightly 首个 Windows 包同款缺陷）
          Set-Content -Path falcon-desktop/qt.conf -Value "[Paths]`nPlugins = plugins"

          # MSVC CRT：目标机器未装 VC++ Redistributable 时避免缺
          # vcruntime140.dll / vcruntime140_1.dll / msvcp140.dll。
          # runner 的 VS 目录布局会漂移（2026-09-13 windows-latest 实测
          # 2022/* 通配不中），放宽年份/版本通配并以 System32 兜底
          # （装过 VS 的机器系统目录必有同版本 Redist DLL）
          $crtDirs = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue
          if (-not $crtDirs) {
            $crtDirs = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue
          }
          if ($crtDirs) {
            $crtDir = $crtDirs | Sort-Object FullName -Descending | Select-Object -First 1
            Copy-Item "$($crtDir.FullName)\*.dll" falcon-desktop/ -Force
            Write-Host "Copied MSVC CRT from $($crtDir.FullName)"
          } else {
            $crtFiles = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll")
            $found = @()
            foreach ($f in $crtFiles) {
              $p = Join-Path $env:SystemRoot "System32\$f"
              if (Test-Path $p) {
                Copy-Item $p falcon-desktop/ -Force
                $found += $f
              }
            }
            if ($found.Count -gt 0) {
              Write-Host "Copied MSVC CRT from System32: $($found -join ', ')"
            } else {
              Write-Warning "MSVC CRT not found (Redist dir and System32 both empty); target machines need VC++ Redistributable"
            }
          }
          Get-ChildItem falcon-desktop -Name

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        timeout-minutes: 3
        with:
          name: falcon-desktop-${{ matrix.os }}
          path: ${{ github.workspace }}/build-desktop/bin/Release/falcon-desktop/
          retention-days: 7
